name: Daily digest

on:
  schedule:
    - cron: "0 5 * * *"  # 08:00 по Минску (UTC+3)
  workflow_dispatch:

permissions:
  contents: write  # чтобы закоммитить state.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # до 10 минут ожидания имени + генерация с веб-поиском
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: python digest.py

      - name: Save state.json
        if: always()  # имя сохраняем, даже если подборка не собралась
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state.json"
          git pull --rebase
          git push
