name: Daily digest

on:
  schedule:
    - cron: "17 * * * *"  # каждый час: только обработать входящие (подписки, имена, /interests) —
                          # routine в 06:07 видит state.json на 05:17
    - cron: "0 5 * * *"   # 08:00 по Минску: рассылка, если routine уже положила выпуск
    - cron: "0 7 * * *"   # 10:00 по Минску: крайний срок — если ещё ничего не ушло, шлём что есть
  push:
    branches: [claude/shared]  # routine запушила выпуск: после 08:00 и если сегодня ещё не слали — рассылаем
  workflow_dispatch:           # вручную — рассылка всегда

permissions:
  contents: write  # чтобы закоммитить state.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # до 10 минут ожидания имени
    env:
      # режим для digest.py; cron-выражения здесь и в on.schedule должны совпадать
      MODE: >-
        ${{ github.event_name == 'push' && 'push'
          || github.event_name == 'workflow_dispatch' && 'force'
          || github.event.schedule == '17 * * * *' && 'sync'
          || github.event.schedule == '0 5 * * *' && 'morning'
          || 'deadline' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push-запуск приходит из ветки claude/shared, но код и state.json всегда берём из основной
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch digest texts
        # тексты кладёт routine Claude Code в ветку claude/shared; нет их — уйдёт урезанная подборка
        if: env.MODE != 'sync'
        run: |
          (git fetch --depth 1 origin claude/shared && git show FETCH_HEAD:digest.json > digest.json) \
            || { rm -f digest.json; echo "digest.json в ветке claude/shared нет"; }
          for f in postcard.jpg postcard.png meme.jpg meme.png; do git show "FETCH_HEAD:$f" > "$f" 2>/dev/null || rm -f "$f"; done

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: python digest.py

      - name: Save state.json
        if: always()  # имя и отметку о рассылке сохраняем, даже если подборка не собралась
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state.json"
          git pull --rebase
          git push
