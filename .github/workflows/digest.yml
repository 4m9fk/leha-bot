name: Daily digest

on:
  schedule:
    - cron: "30 2 * * *"  # 05:30 по Минску: только обработать входящие, чтобы routine видела свежий state.json
    - cron: "0 5 * * *"   # 08:00 по Минску: рассылка
  workflow_dispatch:

permissions:
  contents: write  # чтобы закоммитить state.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # до 10 минут ожидания имени
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch digest texts
        # тексты кладёт routine Claude Code в ветку claude/shared; нет их — уйдут приветствие, погода и курсы
        if: github.event.schedule != '30 2 * * *'
        run: |
          (git fetch --depth 1 origin claude/shared && git show FETCH_HEAD:digest.json > digest.json) \
            || { rm -f digest.json; echo "digest.json в ветке claude/shared нет"; }
          for f in meme.jpg meme.png; do git show "FETCH_HEAD:$f" > "$f" 2>/dev/null || rm -f "$f"; done

      - name: Send digest
        env:
          SYNC_ONLY: ${{ github.event.schedule == '30 2 * * *' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
        run: python digest.py

      - name: Save state.json
        if: always()  # имя сохраняем, даже если подборка не собралась
        run: |
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update state.json"
          git pull --rebase
          git push
